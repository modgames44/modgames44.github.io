<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stand PS4 Exploit</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-image: url('MG.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            background-color: #121212;
        }

        #result, #user-agent {
            display: none;
        }
    </style>
</head>
<body>

    <div id="result"></div>
    <div id="user-agent"></div>

    <script>
        function processDevice() {
            const userAgent = navigator.userAgent;
            const isPS4 = /PlayStation 4|PS4/i.test(userAgent);

            if (isPS4) {
                const fwMatch = userAgent.match(/(?:PlayStation 4|PS4)[\s\/]+([\d\.]+)/i);

                if (fwMatch && fwMatch[1]) {
                    const firmware = parseFloat(fwMatch[1]);

                    if (firmware >= 5.00 && firmware <= 6.72) {
                        setTimeout(() => {
                            window.location.href = "https://modgames44.github.io/505-672/index.html";
                        }, 1500);

                    } else if (firmware >= 7.00 && firmware <= 9.60) {
                        setTimeout(() => {
                            window.location.href = "https://modgames44.github.io/700-960/index.html";
                        }, 1500);

                    } else if (firmware >= 10.00 && firmware <= 11.02) {
                        setTimeout(() => {
                            window.location.href = "https://modgames44.github.io/1000-1102/index.html";
                        }, 1500);

                    } else if (firmware >= 11.50 && firmware <= 13.00) {
                        setTimeout(() => {
                            window.location.href = "https://modgames44.github.io/1150-1300/index.html";
                        }, 1500);
                    }
                }
            }
        }

        window.onload = processDevice;
    </script>

</body>
</html>
